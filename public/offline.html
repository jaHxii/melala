<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melala — Offline</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #160e08;
        color: #f5f0e8;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      p {
        color: #a89a88;
        margin: 0 0 1.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.75rem 2rem;
        border-radius: 999px;
        background: #f5f0e8;
        color: #160e08;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .btn:hover {
        background: #e8e0d4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Please check your internet connection and try again.</p>
      <button class="btn" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
